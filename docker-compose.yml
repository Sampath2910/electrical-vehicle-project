version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartev_postgres
    environment:
      POSTGRES_DB: smartevdb
      POSTGRES_USER: smartev
      POSTGRES_PASSWORD: smartev_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartev_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: smartev_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartev_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smartevdb
      DB_USERNAME: smartev
      DB_PASSWORD: smartev_secure_password
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      JWT_SECRET: dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3Itc21hcnQtZXYtcGxhdGZvcm0tMjAyNg==
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - mqtt-broker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartev_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws-ev
      NEXT_PUBLIC_DATA_MODE: mock
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
